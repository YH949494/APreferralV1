<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Redesign Prototype</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* Layout concept: left task navigation (8 destinations), a persistent "what do you want to do" bar and search,
   one working canvas. Staged flows keep a review step; consequence decides how strict each confirmation is. */
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #eef0f3; --ink: #14181f; --ink-2: #4a5361; --line: #dde1e7;
  --brand: #2557d6; --brand-ink: #ffffff; --brand-soft: #e6edfc;
  --ok: #1a7f4b; --ok-soft: #e3f4ea; --warn: #9a5b00; --warn-soft: #fdf0d9; --bad: #b42d26; --bad-soft: #fbe6e4;
  --live: #c0322b; --shadow: 0 1px 2px rgba(20,24,31,.06), 0 8px 24px rgba(20,24,31,.08);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1216; --panel: #171b21; --panel-2: #1e242c; --ink: #e8ebf0; --ink-2: #a3adbb; --line: #2a313b;
  --brand: #6f97ff; --brand-ink: #0b1020; --brand-soft: #1c2a4d;
  --ok: #4cc38a; --ok-soft: #12301f; --warn: #f0b24a; --warn-soft: #3a2b0e; --bad: #ff8a80; --bad-soft: #3d1a18;
  --live: #ff7b72; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1216; --panel: #171b21; --panel-2: #1e242c; --ink: #e8ebf0; --ink-2: #a3adbb; --line: #2a313b;
  --brand: #6f97ff; --brand-ink: #0b1020; --brand-soft: #1c2a4d;
  --ok: #4cc38a; --ok-soft: #12301f; --warn: #f0b24a; --warn-soft: #3a2b0e; --bad: #ff8a80; --bad-soft: #3d1a18;
  --live: #ff7b72; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  margin: 0; }
h1 { font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; margin: 0 0 4px; text-wrap: balance; }
h3 { font-size: 13px; margin: 0; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--panel); border-right: 1px solid var(--line); padding: 16px 12px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { font-weight: 700; padding: 4px 10px 14px; font-size: 15px; }
.brand small { display: block; font-weight: 400; color: var(--ink-2); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { text-align: left; background: none; border: 0; border-radius: 8px; padding: 9px 10px; display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-weight: 500; }
.nav button:hover { background: var(--panel-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 650; }
.nav svg { width: 18px; height: 18px; flex: none; }
.mainwrap { min-width: 0; display: flex; flex-direction: column; }
.proto-banner { background: var(--warn-soft); color: var(--warn); border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px 24px; font-size: 12.5px; }
.top { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 260px; min-width: 0; max-width: 420px; }
.search input { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }

.search .hint { position: absolute; top: 100%; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; padding: 8px 12px; box-shadow: var(--shadow); z-index: 5; font-size: 13px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.quick-label { color: var(--ink-2); font-size: 12.5px; }
main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 80px 24px; min-width: 0; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; }
.page-head p { color: var(--ink-2); margin-top: 4px; max-width: 70ch; }
.subnav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 14px; font-weight: 550; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-weight: 550; font-size: 13px; }
.chip[aria-pressed="true"], .chip.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
.card + .card { margin-top: 16px; }
.grid > .card + .card, .split > .card + .card { margin-top: 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.tile { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; gap: 12px; align-items: flex-start; }
.tile:hover { border-color: var(--brand); }
.tile .num { font-size: 28px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 2ch; }
.tile .txt { min-width: 0; }
.tile .txt b { display: block; }
.tile .txt span { color: var(--ink-2); font-size: 13px; }
.tile .go { margin-top: 8px; color: var(--brand); font-weight: 600; font-size: 13px; }
.tile.sev-red { border-left: 4px solid var(--bad); } .tile.sev-amber { border-left: 4px solid var(--warn); } .tile.sev-info { border-left: 4px solid var(--brand); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 650; white-space: nowrap; background: var(--panel-2); color: var(--ink-2); }
.pill.live { background: var(--bad-soft); color: var(--live); } .pill.scheduled { background: var(--brand-soft); color: var(--brand); }
.pill.paused, .pill.waiting { background: var(--warn-soft); color: var(--warn); } .pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
.field { display: grid; gap: 4px; margin-bottom: 14px; max-width: 640px; }
.field > label, .field > .lbl { font-weight: 650; }
.field .help { color: var(--ink-2); font-size: 12.5px; }
.field .err { color: var(--bad); font-size: 12.5px; font-weight: 550; }
.field input[type=text], .field input[type=number], .field input[type=datetime-local], .field select, .field textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.field textarea { font-family: var(--mono); font-size: 13px; min-height: 130px; resize: vertical; }
.field.bad input, .field.bad textarea, .field.bad select { border-color: var(--bad); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
.stages { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; font-size: 13px; }
.stages span { padding: 4px 12px; border-radius: 999px; background: var(--panel-2); color: var(--ink-2); font-weight: 600; }
.stages span.on { background: var(--brand); color: var(--brand-ink); } .stages span.done { background: var(--ok-soft); color: var(--ok); }
.notice { border-radius: 8px; padding: 10px 12px; font-size: 13.5px; margin: 10px 0; display: flex; gap: 8px; }
.notice.ok { background: var(--ok-soft); color: var(--ok); } .notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); } .notice.info { background: var(--brand-soft); color: var(--brand); }
.notice ul { margin: 4px 0 0 18px; padding: 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink-2); }
.bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); }
.bar.low > i { background: var(--bad); }
.menu { position: relative; display: inline-block; }
.menu-pop { position: absolute; right: 0; top: 100%; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); min-width: 190px; padding: 4px; }
.menu-pop button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; }
.menu-pop button:hover { background: var(--panel-2); }
.menu-pop button.dng { color: var(--bad); }
.cardgrid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.pick { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 4px; }
.pick:hover, .pick[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
.pick span { color: var(--ink-2); font-size: 13px; }
.modal-bg { position: fixed; inset: 0; background: rgba(8,10,14,.55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { background: var(--panel); border-radius: 12px; max-width: 520px; width: 100%; padding: 20px; box-shadow: var(--shadow); max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 18px; margin-bottom: 8px; }
.modal ul { margin: 8px 0 8px 18px; padding: 0; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.toasts { position: fixed; left: 0; right: 0; bottom: max(16px, env(safe-area-inset-bottom, 0px)); display: grid; justify-items: center; gap: 8px; pointer-events: none; z-index: 60; padding: 0 16px; }
.toast { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: var(--shadow); max-width: 560px; }
.toast button { background: none; border: 0; color: var(--brand); font-weight: 700; filter: brightness(1.3); }
.demo-btn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); z-index: 40; box-shadow: var(--shadow); }
.demo-panel { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 48px); z-index: 40; width: min(340px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
.demo-panel label { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0; font-size: 13px; }
pre.req { background: var(--panel-2); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; margin: 8px 0 0; }
details > summary { cursor: pointer; font-weight: 600; color: var(--ink-2); margin: 8px 0; }
.stub { border: 1px dashed var(--line); border-radius: 10px; padding: 16px; }
.stub li { margin: 3px 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; }
  .brand { padding: 0 4px 6px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .nav button { white-space: nowrap; }
  .split { grid-template-columns: minmax(0, 1fr); }
  main, .top, .proto-banner { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .15s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: 0; } } }
</style>

<div class="shell">
  <aside class="side">
    <div class="brand">Admin <small>Redesign prototype</small></div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </aside>
  <div class="mainwrap">
    <div class="proto-banner"><b>Prototype.</b> Mock data only. Nothing is sent anywhere; reloading resets everything. Open <b>Demo controls</b> (bottom right) to trigger error states.</div>
    <header class="top">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="gsearch" type="text" placeholder="Find a player or affiliate: @username or ID" autocomplete="off" aria-label="Find a player or affiliate">

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const el = html => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const delay = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, "0");
const fmt = n => Number(n).toLocaleString("en-US");
const plural = (n, a, b) => n === 1 ? a : (b || a + "s");

/* ---------- Malaysia-time helpers (fixed UTC+8, same as the app) ---------- */
const KL = 8 * 3600e3;
const klParts = d => { const k = new Date(d.getTime() + KL); return { y: k.getUTCFullYear(), m: k.getUTCMonth(), d: k.getUTCDate(), h: k.getUTCHours(), mi: k.getUTCMinutes() }; };
const klWall = (y, m, d, h, mi) => new Date(Date.UTC(y, m, d, h, mi) - KL);
const fmtKL = d => d.toLocaleString("en-GB", { timeZone: "Asia/Kuala_Lumpur", weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true }) + " (Malaysia time)";
const klString = d => { const p = klParts(d); return `${p.y}-${pad(p.m + 1)}-${pad(p.d)} ${pad(p.h)}:${pad(p.mi)}:00`; };
function presets() {
  const now = new Date(), p = klParts(now);
  let tonight = klWall(p.y, p.m, p.d, 20, 0); if (tonight <= now) tonight = klWall(p.y, p.m, p.d + 1, 20, 0);
  return { now, tonight, tomorrow: klWall(p.y, p.m, p.d + 1, 9, 0) };
}
const monthLabel = ym => { const [y, m] = ym.split("-").map(Number); return new Date(Date.UTC(y, m - 1, 1)).toLocaleString("en-GB", { month: "long", year: "numeric", timeZone: "UTC" }); };
function monthChoices() { const p = klParts(new Date()); return [-1, 0, 1].map(o => { const d = new Date(Date.UTC(p.y, p.m + o, 1)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}`; }); }

/* ---------- the three real code-parsing rules (ported from the backend) ---------- */
// vouchers.py _normalize_codes: per line, trim, strip leading/trailing commas, silent dedupe
function parseDrop(text) {
  const seen = new Set(), usable = [], repeated = []; const invalid = [];
  String(text || "").split(/\r?\n/).forEach(raw => {
    const c = raw.trim().replace(/^,+/, "").replace(/,+$/, "").trim(); if (!c) return;
    if (seen.has(c)) { repeated.push(c); return; } seen.add(c); usable.push(c);
  });
  return { usable, repeated, invalid, rule: "Each line is one code. Spaces and stray commas at the ends are removed. Repeats are merged." };
}
// affiliate_voucher_batches.normalize_voucher_codes: split on newline AND comma, internal whitespace = invalid
function parseBatch(text) {
  const seen = new Set(), usable = [], repeated = [], invalid = [];
  String(text || "").split(/[\r\n,]+/).forEach(raw => {
    const c = raw.trim(); if (!c) return;
    if (/\s/.test(c)) { invalid.push(c); return; }
    if (seen.has(c)) { repeated.push(c); return; } seen.add(c); usable.push(c);
  });
  return { usable, repeated, invalid, rule: "Codes can be on separate lines or separated by commas. A code that contains a space is rejected." };
}
// reward pools / legacy pool upload: per line, trim; codes already stored are skipped by the database
function parseTrim(text) {
  const seen = new Set(), usable = [], repeated = [];
  String(text || "").split(/\r?\n/).forEach(raw => { const c = raw.trim(); if (!c) return; if (seen.has(c)) { repeated.push(c); return; } seen.add(c); usable.push(c); });
  return { usable, repeated, invalid: [], rule: "Each line is one code. Codes already stored are skipped." };
}

/* ---------- mock data ---------- */
let S;
const EXISTING_CODES = new Set(["WKND-0007", "WKND-0008", "OLD-1234", "AFF10-0001", "AFF10-0002", "SPIN-0001"]);
function freshState() {
  const pr = presets();
  return {
    view: "home", sub: "main",
    demo: { check: true, fail: false, sess: false, other: false, cool: false },
    drops: [
      { id: "d1", name: "Weekend Surprise", status: "live", type: "pooled", total: 480, left: 312, starts: new Date(pr.now.getTime() - 5 * 3600e3), ends: new Date(pr.now.getTime() + 19 * 3600e3) },
      { id: "d2", name: "Welcome Voucher", status: "live", type: "pooled", total: 600, left: 4, starts: new Date(pr.now.getTime() - 9 * 86400e3), ends: new Date(pr.now.getTime() + 21 * 86400e3) },
      { id: "d3", name: "VIP October Boost", status: "scheduled", type: "pooled", total: 150, left: 150, starts: pr.tomorrow, ends: new Date(pr.tomorrow.getTime() + 24 * 3600e3) },
      { id: "d4", name: "Friday Flash", status: "paused", type: "pooled", total: 200, left: 120, starts: new Date(pr.now.getTime() - 2 * 86400e3), ends: new Date(pr.now.getTime() + 86400e3) },
      { id: "d5", name: "Personal thank-you codes", status: "live", type: "personalised", total: 40, left: 22, starts: new Date(pr.now.getTime() - 86400e3), ends: new Date(pr.now.getTime() + 6 * 86400e3) },
    ],
    stock: { AFFILIATE_5: 142, AFFILIATE_10: 8, AFFILIATE_50: 3, WELCOME: 220, "OCT-TOURNEY-10": 30, "SEP-MISSION-5": 60 },
    shortage: { pool: "AFFILIATE_10", month: monthChoices()[1], waiting: 14 },
    queue: buildQueue(),
    campaigns: [
      { id: "c1", name: "October Lucky Draw", kind: "Registration", status: "live" },
      { id: "c2", name: "Arena Weekly Cup", kind: "Tournament", status: "scheduled" },
      { id: "c3", name: "Feedback Mission", kind: "Mission", status: "paused" },
      { id: "c4", name: "Weekend Surprise", kind: "Voucher", status: "live" },
    ],
    results: [
      { id: "r1", campaign: "Arena Weekly Cup", winners: 10, pool: "OCT-TOURNEY-10", need: 10 },
      { id: "r2", campaign: "Spin Cup (week 41)", winners: 25, pool: "OCT-TOURNEY-10", need: 25 },
    ],
    people: buildPeople(),
    xp: { 7001234501: 5120, 7001234502: 1240, 7001234503: 310, 7001234504: 860, 7001234505: 90 },
    lastUpload: null,
  };
}
function buildQueue() {
  const M = monthChoices();

function dropMenu(d) {

      $("#lc", c).oninput = e => { $("#go", c).disabled = e.target.value.trim() !== "LAUNCH"; }; $("#bk", c).onclick = () => { C.stage = 2; details(); };
      $("#go", c).onclick = async () => { const b = $("#go", c); b.disabled = true; b.textContent = "Launching…";
        try { await server(() => { S.campaigns.unshift({ id: "c" + Date.now(), name: C.name, kind: "Voucher", status: C.starts <= new Date(Date.now() + 60e3) ? "live" : "scheduled" }); S.drops.unshift({ id: "n" + Date.now(), name: C.name, status: C.starts <= new Date(Date.now() + 60e3) ? "live" : "scheduled", type: "pooled", total: n, left: n, starts: C.starts, ends: new Date(C.starts.getTime() + 86400e3) }); });
          body.innerHTML = `<div class="card"><div class="notice ok"><div><b>Launched “${esc(C.name)}”.</b> ${drops} ${plural(drops, "drop")} created with ${fmt(n)} vouchers.</div></div><div class="row" style="margin-top:12px"><button class="btn primary" id="vd">View drops</button></div></div>`; $("#vd", body).onclick = () => go("vouchers", "drops");
        } catch (e) { b.disabled = false; b.textContent = "Launch campaign"; $("#lerr", c).innerHTML = `<div class="notice bad"><div>${esc(ERR[e.code] || ERR.unknown)}</div></div>`; } };
    });
  }
  pick(); return w;
};

/* ---------- PLAYERS ---------- */
VIEWS["players:find"] = function () {
  const w = el(`<div><div class="page-head"><div><h1>Find a player</h1><p>Profile, XP, referral counts, risk signals and history, in one place.</p></div></div><div class="card"><div class="field" style="margin:0"><label for="pl-q">@username or ID</label><div class="row"><input type="text" id="pl-q" style="max-width:320px;padding:9px 10px;border:1px solid var(--border,var(--line));border-radius:8px;background:var(--panel)" placeholder="@jun_wei"><button class="btn primary" id="pl-go">Open</button></div><div class="err" id="pl-err" hidden></div></div></div><div id="pl-out" style="margin-top:16px"></div></div>`);
  const open = q => { const p = lookup(q), err = $("#pl-err", w); err.hidden = true; if (!p) { err.hidden = false; err.textContent = "No player found for that ID or @username. Search matches the exact @username or ID."; return; } go("affiliates", "find", { q: "@" + p.user }); };
  $("#pl-go", w).onclick = () => open($("#pl-q", w).value); $("#pl-q", w).onkeydown = e => { if (e.key === "Enter") open(e.target.value); }; return w;
};
VIEWS["players:xp"] = function () {
  const X = { q: (S.ctx && S.ctx.q) || "", p: null, amt: "" }; const XP_T = 1000;
  const w = el(`<div><div class="page-head"><div><h1>Add or remove XP</h1><p>Look up the player first, then see exactly what changes before you confirm.</p></div></div><div class="card" style="max-width:640px">
    <div class="field" id="f-q"><label for="xq">Player</label><input type="text" id="xq" value="${esc(X.q)}" placeholder="@username or ID"><div class="help" id="xhelp">Try @sam_tan</div><div class="err" hidden></div></div>
    <div id="xcard"></div>
    <div class="field" id="f-a"><label for="xa">XP to add (use a minus sign to remove)</label><div class="chips" id="xqk">${[-100, -50, 50, 100, 500].map(n => `<button class="chip" data-n="${n}">${n > 0 ? "+" : ""}${n}</button>`).join("")}</div><input type="number" id="xa" placeholder="e.g. 100 or -50" style="margin-top:6px"><div class="err" hidden></div></div>
    <div id="xprev"></div><div class="row"><button class="btn primary" id="xgo" disabled>Review change</button></div></div></div>`);
  const upd = () => { const a = parseInt($("#xa", w).value, 10); X.amt = Number.isFinite(a) ? a : 0; const prev = $("#xprev", w);
    if (X.p && X.amt) { const cur = S.xp[X.p.id] ?? 0, nw = cur + X.amt; prev.innerHTML = `<div class="notice ${nw < 0 ? "bad" : "info"}"><div><b>@${esc(X.p.user)}</b>: ${fmt(cur)} → <b>${fmt(Math.max(0, nw))}</b> XP (${X.amt > 0 ? "+" : ""}${fmt(X.amt)})${nw < 0 ? ". They only have " + fmt(cur) + ", so XP can't go below zero." : ""}${Math.abs(X.amt) >= XP_T ? ` This is a large change, so you'll be asked to type a confirmation.` : ""}</div></div>`; } else prev.innerHTML = "";
    $("#xgo", w).disabled = !(X.p && X.amt); };
  const find = () => { const p = lookup($("#xq", w).value), f = $("#f-q", w); f.classList.remove("bad"); $(".err", f).hidden = true;
    if (!$("#xq", w).value.trim()) { X.p = null; $("#xcard", w).innerHTML = ""; upd(); return; }
    if (!p) { X.p = null; $("#xcard", w).innerHTML = ""; f.classList.add("bad"); $(".err", f).hidden = false; $(".err", f).textContent = "No player found. Search matches the exact @username or ID."; upd(); return; }
    X.p = p; $("#xcard", w).innerHTML = `<div class="notice ok"><div><b>${esc(p.name)}</b> <span class="mono">@${esc(p.user)} · ${p.id}</span><br>Current XP: <b>${fmt(S.xp[p.id] ?? 0)}</b> · Segment: ${esc(p.effective)}</div></div>`; upd(); };
  $("#xq", w).onchange = find; $("#xq", w).oninput = () => { clearTimeout(w._t); w._t = setTimeout(find, 300); }; $("#xa", w).oninput = upd;
  $$("#xqk .chip", w).forEach(b => b.onclick = () => { $("#xa", w).value = b.dataset.n; upd(); });
  $("#xgo", w).onclick = () => { const p = X.p, amt = X.amt, cur = S.xp[p.id] ?? 0, nw = Math.max(0, cur + amt), big = Math.abs(amt) >= XP_T;
    modal({ title: `${amt > 0 ? "Add" : "Remove"} ${fmt(Math.abs(amt))} XP ${amt > 0 ? "to" : "from"} @${p.user}?`, tier: big ? 3 : 2, phrase: `XP ${amt > 0 ? "+" : "-"}${Math.abs(amt)}`, danger: amt < 0, primary: amt > 0 ? "Add XP" : "Remove XP",
      body: `<p>${fmt(cur)} → <b>${fmt(nw)}</b> XP for <b>@${esc(p.user)}</b>. Takes effect immediately.</p><p class="muted">This request carries a unique key, so a double click can't apply it twice.</p>`,
      run: () => server(() => { if (S.demo.cool) { const e = new Error("c"); e.code = "cooldown"; throw e; } S.xp[p.id] = nw; }) })
      .then(r => { if (r) { toast(`Done. @${p.user} now has ${fmt(nw)} XP.`); $("#xa", w).value = ""; find(); } }); };
  if (X.q) setTimeout(find, 0); return w;
};

/* ---------- global search + boot ---------- */
(function () {
  const inp = $("#gsearch"), hint = $("#ghint");
  const hide = () => hint.hidden = true;
  inp.oninput = () => { const q = inp.value.trim(); if (!q) { hide(); return; } hint.hidden = false; hint.innerHTML = `Press Enter to look up <b>${esc(q)}</b><div class="muted">Matches an exact @username or ID.</div>`; };
  inp.onkeydown = e => { if (e.key === "Escape") hide(); if (e.key !== "Enter") return; const q = inp.value.trim(); if (!q) return; const p = lookup(q);
    if (!p) { hint.hidden = false; hint.innerHTML = `<b>No player found</b> for “${esc(q)}”.<div class="muted">Search matches the exact @username or ID. Try @mei_lin or @arif_k.</div>`; return; } hide(); inp.value = ""; go("affiliates", "find", { q: "@" + p.user }); };
  document.addEventListener("click", e => { if (!e.target.closest(".search")) hide(); });
  $("#demo-btn").onclick = () => { const p = $("#demo-panel"); p.hidden = !p.hidden; $("#demo-btn").setAttribute("aria-expanded", String(!p.hidden)); };
  const bind = (id, key) => $(id).onchange = e => { S.demo[key] = e.target.checked; if (key === "check" && S.view === "vouchers") render(); };
  bind("#d-check", "check"); bind("#d-fail", "fail"); bind("#d-sess", "sess"); bind("#d-other", "other"); bind("#d-cool", "cool");
  $("#d-reset").onclick = () => { S = freshState(); ["#d-fail", "#d-sess", "#d-other", "#d-cool"].forEach(i => $(i).checked = false); $("#d-check").checked = true; renderQuick(); render(); toast("Mock data reset."); };
  S = freshState(); renderQuick(); render();
})();
</script>
